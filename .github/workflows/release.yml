# Release: build the sdist and the macOS arm64 wheel, then publish them to PyPI with trusted
# publishing (OpenID Connect; no API token is stored in the repository). Publishing waits for
# the `pypi` environment, which can require a manual approval, and runs only for a pushed v*
# tag; a manual run builds and checks the distributions without publishing them.
# docs/releasing.md has the one-time setup and the steps.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # build only

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Wheels run on macOS 14 and later rather than only on the build machine's version.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $version"; exit 1
          fi

      - name: Licences and notices
        run: uv run --no-project python scripts/check_licenses.py

      - name: Build sdist and wheel (the wheel is built from the sdist)
        run: uv build

      - name: Check the distributions
        run: |
          uvx twine@7.0.0 check --strict dist/*
          wheel="$(find dist -name '*.whl')"
          uv run --isolated --no-project --with "$wheel" python -c \
            "import json, judgly; print(json.dumps(json.loads(judgly.native_version()), indent=2))"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/judgly/
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

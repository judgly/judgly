[project]
name = "judgly"
version = "0.0.1"
description = "Calibrated, deterministic judgments from open language models (early development)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Timo Lassmann" }
]
requires-python = ">=3.10"
dependencies = []
keywords = ["calibration", "language-models", "classification", "decision", "gemma", "llama.cpp"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/TimoLassmann/judgly"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

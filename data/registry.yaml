# Data registry: every source judgly's heads are fitted or evaluated on.
#
# Read by scripts/prep_tiers.py (builds the tiers), scripts/fetch_raw.py (downloads the `raw`
# files), scripts/verify_licences.py (checks every licence against the dataset card at the
# pinned revision, and every recorded licence decision against its quoted source) and
# scripts/calibration_record.py (credits the sources in each calibration record).
# docs/methods.md explains the design, docs/licences.md the licence evidence and the excluded
# candidates, and docs/reproduce.md gives the commands.
#
# LICENCE POLICY
#   - A head is FITTED only on sources whose dataset card, at the pinned revision, names a
#     permissive licence (policy.permissive), and on judgly's own generated tasks.
#   - The stance head may also be fitted on share-alike sources (policy.share_alike). The
#     stance head is then released under CC-BY-SA-4.0, separately from the Apache-2.0 code.
#   - Everything else (non-commercial, custom, "other", "unknown", or no licence on the card)
#     is used for EVALUATION only, never for fitting.
#   - Model-written data: text written by a model (with or without human revision) may be
#     fitted on when its labels are human judgments and the dataset's licence is allowed;
#     labels written by a model (a model's rating, preference, verdict or soft distribution)
#     are never fitted on, whatever the licence. WANLI (GPT-3 text, crowdworker labels) is
#     fitted; UltraFeedback and Prometheus (GPT-4 labels) are not used, and typed-decisions (a
#     teacher model's gold) and JevBench's model-written items are evaluation only.
#   - `licence` is copied from the card's `license` field; `licence_text` quotes the card's
#     licensing section where the field alone is not enough to decide. Where the card is wrong
#     or incomplete, `licence_decision` records how the source is treated (`treat_as`), why,
#     and the primary evidence (`source`, a URL, and `quote`, text found there). A source
#     whose licence cannot be confirmed goes to evaluation or is not used.
#   - No dataset text is committed or redistributed: the tiers are rebuilt from the pinned
#     sources, and only their SHA-256 (data/tiers.sha256) is committed.
#
# TIERS (per format; a family belongs to exactly one tier)
#   fit         fitting data: split 70/15/15 into train, validation (lambda and early stopping)
#               and test (in-distribution check), grouped so that items sharing a passage (or a
#               recorded group: an evidence page, a prompt) stay in one split
#   dev         held-out families, scored during development (the stance stop rule)
#   final       fresh held-out families, never used in any experiment before this tier was
#               frozen; read once, after the heads are fitted, for the reported numbers
#   final-flagged  fresh held-out families like final, read with it, but each with a recorded
#               `caveat` (a relative of a fit family, or a label that the text states); reported
#               beside the final numbers, never pooled into them, and judging no bar
#   final-seen  an earlier held-out tier; its families were read during development, so
#               they are reported separately, as a secondary evaluation of previously seen
#               families, never as the final result
#   bench       external benchmarks (general format), evaluation only, scored as they define
#   confirm     untouched families for a pre-registered confirmation (evaluation only): never
#               used in any experiment before; built after every other tier, and an item that
#               matches any other tier, any reserved source or (stance) any evaluation source
#               as a whole is dropped
#   reserved    in no tier; kept unseen for later work (every tier is checked against it)
#   none        not used (the reason is given)
#
# Build order (overlap is removed against every earlier tier): reserved, final-seen, dev,
# final, final-flagged, bench, fit, confirm. final-seen and dev are therefore built from their sources alone;
# final drops anything matching reserved, final-seen or dev (exact, shared
# sentence, shared passage or near duplicate), final-flagged also anything matching final;
# bench is kept whole; fit drops anything matching any evaluation tier; confirm drops anything
# matching any other tier. A source marked `was_reserved` was reserved when the 0.1.0 tiers were
# built: those tiers are still checked against it, so that they stay as released.
#
# Revisions are Hugging Face commit hashes or, for `raw` files, a commit of the source
# repository plus the file's SHA-256 (checked 2026-09-27). `pool` caps the items a source
# contributes to its tier (default: the tier size in scripts/prep_tiers.py). `use: false`
# marks a source the policy excludes: its family is a fit family and its licence is not
# permissive.

